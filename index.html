<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f5262">
  <title>潜水作业排班与安全复核台</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>潜水作业排班与安全复核台</h1>
      <div class="muted">离线可用 · 数据仅保存在本机浏览器 · 遗址 / 潜次 / 人员 / 气瓶 / 天气窗口联合把关</div>
    </div>
    <div class="top-actions">
      <label class="operator">
        当前操作者
        <input id="operator" list="operatorList" placeholder="输入姓名后再操作" autocomplete="off">
        <datalist id="operatorList"></datalist>
      </label>
      <button id="exportMarksBtn" class="secondary" type="button">导出标记JSON</button>
      <button id="exportAllBtn" class="secondary" type="button">导出全部数据</button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="board" class="active">排班看板</button>
    <button data-tab="data">遗址/人员/气瓶/天气</button>
    <button data-tab="map">遗址标记图</button>
    <button data-tab="audit">操作记录</button>
  </nav>

  <!-- 排班看板 -->
  <main class="tabpane active" id="pane-board">
    <section class="panel">
      <div class="panel-head">
        <h2>新建潜次排班</h2>
        <button type="button" class="ghost" id="resetTaskFormBtn">清空表单</button>
      </div>
      <form id="taskForm" class="grid-form">
        <input type="hidden" name="id">
        <input type="hidden" name="clientKey">
        <label>潜次编号<input name="code" required placeholder="例如 DIVE-002"></label>
        <label>遗址<select name="siteId" required></select></label>
        <label>计划开始<input name="start" type="datetime-local" required></label>
        <label>计划结束<input name="end" type="datetime-local" required></label>
        <label>计划水深(米)<input name="depthM" type="number" min="1" step="0.1" required></label>
        <label>计划水下时长(分钟)<input name="plannedMin" type="number" min="1" step="1" required></label>
        <label class="span2">任务说明<input name="note" placeholder="目标、注意事项"></label>
        <div class="span2">
          <div class="row-head"><label>人员与气瓶编组</label>
            <button type="button" class="ghost small" id="addAssignBtn">+ 增加一名潜水员</button>
          </div>
          <div id="assignRows" class="assign-rows"></div>
          <div class="muted" id="gasPreview"></div>
        </div>
        <div class="span2 form-actions">
          <button id="submitTaskBtn">提交排班（待复核）</button>
          <button type="button" class="secondary" id="updateTaskBtn" hidden>保存修改（仍需复核）</button>
          <button type="button" class="secondary" id="cancelEditTaskBtn" hidden>取消编辑</button>
        </div>
      </form>
    </section>

    <section class="board-filters panel">
      <select id="taskStatusFilter">
        <option value="">全部状态</option>
        <option value="pending_review">待复核</option>
        <option value="approved">已批准</option>
        <option value="executing">执行中</option>
        <option value="closed">已关闭</option>
        <option value="rejected">已驳回</option>
      </select>
      <select id="taskSiteFilter"><option value="">全部遗址</option></select>
      <input id="taskSearch" placeholder="搜索编号 / 说明 / 人员">
    </section>

    <section class="kanban" id="kanban"></section>
  </main>

  <!-- 基础数据 -->
  <main class="tabpane" id="pane-data">
    <div class="data-grid">
      <section class="panel">
        <h2>遗址</h2>
        <form id="siteForm" class="stack-form">
          <input type="hidden" name="id">
          <input name="code" placeholder="编号 SITE-01" required>
          <input name="name" placeholder="名称" required>
          <input name="depthM" type="number" min="1" step="0.1" placeholder="参考水深(米)" required>
          <input name="note" placeholder="备注">
          <button>保存遗址</button>
        </form>
        <div class="mini-list" id="siteList"></div>
      </section>

      <section class="panel">
        <h2>潜水员</h2>
        <form id="diverForm" class="stack-form">
          <input type="hidden" name="id">
          <input name="name" placeholder="姓名" required>
          <input name="cert" placeholder="资质证书编号">
          <input name="sac" type="number" min="1" step="1" placeholder="SAC 水面耗气 L/min（默认20）">
          <input name="phone" placeholder="联系电话">
          <input name="note" placeholder="备注">
          <button>保存人员</button>
        </form>
        <div class="mini-list" id="diverList"></div>
      </section>

      <section class="panel">
        <h2>气瓶与余量</h2>
        <form id="cylinderForm" class="stack-form">
          <input type="hidden" name="id">
          <input name="code" placeholder="气瓶编号 C-12L-01" required>
          <input name="volumeL" type="number" min="1" step="1" placeholder="水容积(升)" required>
          <input name="pressureBar" type="number" min="0" step="1" placeholder="当前表压(bar)" required>
          <input name="reserveBar" type="number" min="0" step="1" placeholder="残压保护(bar，默认50)">
          <input name="note" placeholder="备注（如补气说明）">
          <button>保存气瓶</button>
        </form>
        <div class="mini-list" id="cylinderList"></div>
      </section>

      <section class="panel">
        <h2>天气窗口</h2>
        <form id="windowForm" class="stack-form">
          <input type="hidden" name="id">
          <select name="siteId" required></select>
          <label class="inline-flat"><input type="checkbox" name="stateBadge"> 恶劣天气窗口（勾选=禁止作业）</label>
          <input name="from" type="datetime-local" required>
          <input name="to" type="datetime-local" required>
          <input name="note" placeholder="海况/能见度说明">
          <button>保存窗口</button>
        </form>
        <div class="mini-list" id="windowList"></div>
      </section>
    </div>
  </main>

  <!-- 遗址标记图（原单页功能） -->
  <main class="tabpane" id="pane-map">
    <div class="app">
      <section class="panel">
        <div class="muted map-hint">点击沉船平面图添加标记；点击已有标记可编辑。</div>
        <div class="map" id="map"><div class="wreck"></div></div>
      </section>
      <aside class="panel">
        <div class="toolbar">
          <select id="filter">
            <option value="">全部类型</option>
            <option value="ceramic">陶片</option>
            <option value="wood">木构件</option>
            <option value="metal">金属件</option>
            <option value="unknown">未知物</option>
          </select>
          <select id="view">
            <option value="list">标记列表</option>
            <option value="timeline">潜次时间线</option>
          </select>
        </div>
        <form id="markForm">
          <h2>标记信息</h2>
          <input name="id" type="hidden">
          <label>编号</label><input name="code" required>
          <label>类型</label><select name="type"><option value="ceramic">陶片</option><option value="wood">木构件</option><option value="metal">金属件</option><option value="unknown">未知物</option></select>
          <label>潜次</label><input name="dive" placeholder="例如DIVE-04" required>
          <label>深度</label><input name="depth" placeholder="例如18.4m" required>
          <label>朝向</label><input name="orientation" placeholder="例如东北偏北">
          <label>保存状态</label><input name="condition" placeholder="例如表面附着贝类">
          <label>备注</label><textarea name="note"></textarea>
          <input type="hidden" name="x"><input type="hidden" name="y">
          <div class="toolbar"><button type="submit">保存标记</button><button type="button" id="deleteMarkBtn" class="secondary">删除</button></div>
        </form>
        <h2 id="listTitle">标记列表</h2>
        <div id="list" class="list"></div>
      </aside>
    </div>
  </main>

  <!-- 操作记录 -->
  <main class="tabpane" id="pane-audit">
    <section class="panel">
      <div class="panel-head">
        <h2>操作记录（操作者 · 时间 · 前后状态）</h2>
        <div>
          <select id="auditEntityFilter">
            <option value="">全部对象</option>
            <option value="tasks">潜次</option>
            <option value="marks">标记</option>
            <option value="sites">遗址</option>
            <option value="divers">人员</option>
            <option value="cylinders">气瓶</option>
            <option value="windows">天气窗口</option>
          </select>
        </div>
      </div>
      <div id="auditList" class="audit-list"></div>
    </section>
  </main>

  <!-- 关闭/驳回弹层 -->
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <h3 id="modalTitle"></h3>
      <form id="modalForm">
        <div id="modalBody"></div>
        <div class="form-actions">
          <button id="modalConfirm">确认</button>
          <button type="button" class="secondary" id="modalCancel">取消</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
